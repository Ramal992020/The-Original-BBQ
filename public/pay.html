<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>إتمام الدفع — The Original BBQ</title>
  <meta name="theme-color" content="#0D0A08" />
  <meta name="color-scheme" content="light dark" />
  <script src="/theme.js?v=959848079cc2"></script>
  <link rel="stylesheet" href="/fonts.css?v=3eb34584909d" />
  <link rel="stylesheet" href="/styles.css?v=341e4aa86dea" />
  <style>
    /* Palette and fonts are shared with the app; payment layout stays independent. */
    :root { --badge-bg: var(--tint-ember); --badge-border: var(--border); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh;
           display:flex; align-items:center; justify-content:center; padding:18px;
           transition:background-color .25s ease, color .25s ease; }
    .card { display:block; position:relative; width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border);
            border-radius:12px; padding:22px; box-shadow:var(--shadow);
            transition:background-color .25s ease, border-color .25s ease; }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin:4px 0 12px; }
    .brand .logo-full {
      height:88px; width:auto; max-width:100%; object-fit:contain;
      padding:6px 9px; border-radius:8px; filter:drop-shadow(0 2px 6px rgba(246,140,29,.3));
    }
    [data-theme='night'] .brand .logo-full { background:#1A1410; filter:none; }
    h1 { font-size:20px; margin:16px 0 4px; } p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:12px;
             font-weight:800; background:var(--badge-bg); border:1px solid var(--badge-border); color:var(--link); }
    .box { background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:14px; margin-top:14px; }
    .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:14px; }
    .row + .row { border-top:1px dashed var(--border); }
    .row.total { font-weight:800; font-size:17px; border-top:1px solid var(--border); margin-top:6px; padding-top:12px; }
    .price { color:var(--gold); font-weight:900; }
    .btn { display:block; width:100%; padding:15px; border:0; border-radius:14px; font-weight:800; font-size:15px;
           font-family:var(--font-heading); cursor:pointer; margin-top:10px; }
    .btn-pay { background:var(--btn-bg); color:var(--btn-text);
               box-shadow:var(--shadow-cta); }
    .btn-fail { background:transparent; color:var(--red); border:1px solid color-mix(in srgb, var(--red) 40%, transparent); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .note { font-size:12px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.7; }
    .kv { display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:13px; color:var(--muted); }
    .kv b { color:var(--text); font-weight:700; }
    .items { max-height:180px; overflow:auto; }
    .spinner { width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--ember);
               animation:spin .8s linear infinite; margin:26px auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .center { text-align:center; }
    .ok { color:var(--green); font-size:44px; }
    .err { color:var(--red); font-size:44px; }
    .secure { display:flex; align-items:center; justify-content:center; gap:6px; font-size:11.5px; color:var(--muted); margin-top:12px; }
    #themeBtn { position:absolute; top:14px; inset-inline-end:14px; width:36px; height:36px; border-radius:11px;
                display:grid; place-items:center; font-size:16px; cursor:pointer;
                background:var(--surface-2); border:1px solid var(--border); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <button id="themeBtn" type="button" aria-label="تفعيل وضع الليل (فاتح)" title="تفعيل وضع الليل (فاتح)">☀️</button>
    <div class="brand">
      <img class="logo-full" src="/img/logo.svg?v=fba50bf4289a" alt="The Original BBQ — مشاوي على الفحم" />
    </div>
    <div id="body"><div class="spinner"></div></div>
  </div>

<script>
const q = new URLSearchParams(location.search);
const ref = q.get('ref') || '';
const token = q.get('t') || '';
const $ = (s) => document.querySelector(s);
const money = (n, cur) => `${Math.round(Number(n) || 0).toLocaleString('ar-EG')} ${esc(({ SAR: 'ر.س', EGP: 'ج.م' })[cur] || cur || 'ج.م')}`;
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* Day = dark; night = light. The app and payment page share one saved preference. */
function updateThemeButton() {
  const night = window.BBQTheme.get() === 'night';
  const button = $('#themeBtn');
  const label = night ? 'تفعيل وضع النهار (داكن)' : 'تفعيل وضع الليل (فاتح)';
  button.textContent = night ? '🌙' : '☀️';
  button.title = label;
  button.setAttribute('aria-label', label);
  button.setAttribute('aria-pressed', String(night));
}
window.addEventListener('bbq:theme', updateThemeButton);
updateThemeButton();
$('#themeBtn').onclick = () => window.BBQTheme.toggle();

async function load() {
  try {
    const r = await fetch(`/api/payments/demo/info?ref=${encodeURIComponent(ref)}&t=${encodeURIComponent(token)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'رابط غير صالح');
    render(d.order);
  } catch (e) {
    $('#body').innerHTML = `
      <div class="center" style="padding:20px 0">
        <div class="err">⚠️</div>
        <h1>ينفع نكمل الدفع؟</h1>
        <p class="sub">${esc(e.message)}</p>
        <a class="btn btn-fail" style="text-decoration:none;text-align:center" href="/#/my-orders">رجوع لطلباتي</a>
      </div>`;
  }
}

function render(order) {
  const items = (order.items || []).map((i) => `
    <div class="kv"><span>${esc(i.name)}${i.size ? ' — ' + esc(i.size) : ''} ×${i.qty}</span><b>${money(i.line_total || i.price * i.qty, order.currency)}</b></div>`).join('');
  const alreadyPaid = order.payment_status === 'paid';
  $('#body').innerHTML = `
    <span class="badge">🧪 صفحة دفع تجريبية (محاكاة)</span>
    <h1>إتمام دفع طلب ${esc(order.id)}</h1>
    <p class="sub">دي صفحة محاكاة عشان تجرّب الدورة كاملة من غير أي حساب دفع حقيقي.</p>

    <div class="box">
      <div class="kv"><span>الطلب</span><b>${esc(order.id)}</b></div>
      <div class="kv"><span>العميل</span><b>${esc(order.customer.name || '')}</b></div>
      <div class="kv"><span>الهاتف</span><b>${esc(order.customer.phone || '')}</b></div>
      ${order.customer.address ? `<div class="kv"><span>العنوان</span><b>${esc(order.customer.address)}</b></div>` : ''}
    </div>

    <div class="box">
      <strong style="font-size:14px">الطلب</strong>
      <div class="items">${items}</div>
      <div class="row total"><span>الإجمالي</span><span class="price">${money(order.total, order.currency)}</span></div>
    </div>

    ${alreadyPaid ? `
      <div class="center" style="padding:10px 0 0">
        <div class="ok">✅</div>
        <p class="sub">الطلب ده مدفوع بالفعل — مفيش حاجة تدفعها تاني.</p>
        <a class="btn btn-pay" style="text-decoration:none;text-align:center" href="/#/order/${encodeURIComponent(order.id)}">رجوع للطلب</a>
      </div>` : `
      <button class="btn btn-pay" id="payBtn">ادفع ${money(order.total, order.currency)} 💳</button>
      <button class="btn btn-fail" id="failBtn">تجربة حالة فشل الدفع</button>
      <div class="secure">🔒 في الوضع الحقيقي بيتم توجيهك لـ Stripe / Paymob</div>`}
  `;
  if (alreadyPaid) return;
  $('#payBtn').onclick = () => complete(true);
  $('#failBtn').onclick = () => complete(false);
}

async function complete(ok) {
  const btns = document.querySelectorAll('.btn');
  btns.forEach((b) => { b.disabled = true; });
  $('#body').insertAdjacentHTML('afterbegin', '<div class="spinner"></div>');
  try {
    const r = await fetch('/api/payments/demo/complete', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ref, token, ok }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'فشل');
    $('#body').innerHTML = `
      <div class="center" style="padding:14px 0">
        <div class="${ok ? 'ok' : 'err'}">${ok ? '✅' : '✖️'}</div>
        <h1>${ok ? 'تم الدفع بنجاح' : 'فشل الدفع'}</h1>
        <p class="sub">${ok ? 'وصلك تأكيد على واتساب، والطلب دخل قائمة التجهيز.' : 'تقدر تجرّب تاني أو تختار الدفع عند الاستلام.'}</p>
        <div class="spinner"></div>
        <p class="note">بنرجّعك للطلب…</p>
      </div>`;
    setTimeout(() => { location.href = d.redirect || ('/#/order/' + ref); }, 1400);
  } catch (e) {
    $('#body').innerHTML = `<div class="center"><div class="err">⚠️</div><h1>حصلت مشكلة</h1><p class="sub">${esc(e.message)}</p>
      <a class="btn btn-pay" style="text-decoration:none;text-align:center" href="/#/order/${encodeURIComponent(ref)}">رجوع للطلب</a></div>`;
  }
}

load();
</script>
</body>
</html>
